<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <label>
      <input type="checkbox" name="showInlineCount" />
      <span>Show the commit count next to the Previous / Next buttons</span>
    </label>
    <label>
      <input type="checkbox" name="showFloatingCount" />
      <span>Show the floating commit count in the bottom-right corner</span>
    </label>
    <label>
      <input type="checkbox" name="enableShortcuts" />
      <span>
        Use <kbd>p</kbd> / <kbd>n</kbd> for previous / next commit
        <small>Overrides GitLab's previous / next unresolved thread shortcuts while viewing a single commit.</small>
      </span>
    </label>
    <script src="popup.js"></script>
  </body>
</html>
